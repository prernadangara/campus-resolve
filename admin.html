<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        #admin-toast {
            visibility: hidden;
            min-width: 280px;
            max-width: 90%;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 15px;
            padding: 16px 20px;
            position: fixed;
            z-index: 1000;
            right: 20px;
            bottom: 20px;
            font-weight: 800;
            transition: 0.3s;
            opacity: 0;
        }

        #admin-toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
    <title>Admin - Interactive Control</title>
</head>
<body class="bg-slate-100 p-4 md:p-10">
    <div id="admin-toast"></div>
    <div id="admin-login" class="max-w-md mx-auto mt-20 bg-white p-10 rounded-[40px] shadow-2xl border-t-8 border-slate-900">
        <h2 class="text-3xl font-black text-center mb-8 uppercase italic tracking-tighter">Admin Login</h2>
        <input type="email" id="admin-email" placeholder="Admin Email" class="w-full border-2 p-4 rounded-2xl mb-4 outline-none">
        <input type="password" id="admin-pass" placeholder="Password" class="w-full border-2 p-4 rounded-2xl mb-6 outline-none">
        <button onclick="loginAdmin()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black shadow-xl hover:bg-black transition">ENTER SYSTEM</button>
    </div>

    <div id="admin-dash" class="hidden max-w-6xl mx-auto space-y-6">
        
        <div class="bg-indigo-900 p-8 rounded-[40px] shadow-2xl text-white">
            <h3 class="font-black text-xs uppercase tracking-widest mb-4 opacity-70 flex items-center">📢 Campus-Wide Announcement</h3>
            <div class="flex gap-4">
                <input type="text" id="announcement-input" placeholder="Type news here (e.g. Library is closed today)..." class="flex-1 p-5 rounded-3xl bg-indigo-800 border-none outline-none text-sm font-bold placeholder-indigo-400">
                <button onclick="postAnnouncement()" class="bg-white text-indigo-900 px-10 rounded-3xl font-black text-xs hover:scale-105 transition-all shadow-lg">BROADCAST</button>
            </div>
        </div>
        <div class="flex justify-between items-center bg-white p-8 rounded-[35px] shadow-sm border-l-8 border-slate-900">
            <div>
                <h1 class="font-black text-2xl italic uppercase tracking-tighter">College Control Center</h1>
                <p id="filter-status" class="text-[10px] font-bold text-indigo-600 uppercase mt-1">Showing: All Complaints</p>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-50 text-red-600 font-black px-6 py-2 rounded-2xl text-xs hover:bg-red-600 hover:text-white transition">LOGOUT</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-8 rounded-[35px] shadow-sm text-center border-b-8 border-indigo-500">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Reports</p>
                <h3 id="stat-total" class="text-4xl font-black text-slate-900">0</h3>
            </div>
            <div class="bg-white p-8 rounded-[35px] shadow-sm text-center border-b-8 border-orange-500">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Active Cases</p>
                <h3 id="stat-pending" class="text-4xl font-black text-orange-600">0</h3>
            </div>
            <div class="bg-white p-8 rounded-[35px] shadow-sm text-center border-b-8 border-green-500">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Solutions</p>
                <h3 id="stat-resolved" class="text-4xl font-black text-green-600">0</h3>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[30px] shadow-sm border border-slate-200">
            <p class="text-[10px] font-black text-slate-400 mb-4 uppercase text-center tracking-widest underline">Click Category to Filter Table</p>
            <div id="cat-summary" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>
        </div>

        <div class="bg-white rounded-[40px] shadow-2xl overflow-hidden border border-slate-200">
            <table class="w-full text-left">
                <thead class="bg-slate-900 text-white text-[10px] uppercase">
                    <tr><th class="p-6">Student & Priority</th><th class="p-6">Complaint Content</th><th class="p-6">Management</th></tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BVGJYipZut7k2kFM1I3ZojgEq78cKBE",
            authDomain: "collegeportal-318f1.firebaseapp.com",
            projectId: "collegeportal-318f1",
            storageBucket: "collegeportal-318f1.firebasestorage.app",
            messagingSenderId: "430262755254",
            appId: "1:430262755254:web:708f3fc6278744a883eb17"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let activeCategory = 'all'; 

        function showAdminToast(message, type = "success") {
            const toast = document.getElementById("admin-toast");

            toast.innerText = message;
            toast.style.backgroundColor = type === "error" ? "#dc2626" : "#059669";
            toast.className = "show";

            setTimeout(() => {
                toast.className = "";
            }, 3000);
        }

        window.loginAdmin = async () => {
            const e = document.getElementById('admin-email').value, p = document.getElementById('admin-pass').value;
            try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { showAdminToast("Invalid email or password.", "error"); }
        };
        window.logoutAdmin = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "prernadangara@gmail.com") {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-dash').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('admin-login').classList.remove('hidden');
                document.getElementById('admin-dash').classList.add('hidden');
            }
        });

        // NEW: BROADCAST LOGIC
        window.postAnnouncement = async () => {
            const msg = document.getElementById('announcement-input').value;
            if(!msg) return showAdminToast("Please type a message first.", "error");
            try {
                await addDoc(collection(db, "announcements"), {
                    message: msg,
                    timestamp: serverTimestamp()
                });
                document.getElementById('announcement-input').value = "";
                showAdminToast("Announcement broadcasted successfully.");
            } catch(e) { showAdminToast("Error sending broadcast.", "error"); }
        };

        function loadData() {
            onSnapshot(query(collection(db, "complaints"), orderBy("timestamp", "desc")), (snaps) => {
                const tbody = document.getElementById('table-body'); tbody.innerHTML = "";
                let t=0, p=0, r=0, cats={};

                if (snaps.empty) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" class="p-12 text-center">
                                <p class="text-slate-800 font-black text-lg">No complaints submitted yet.</p>
                                <p class="text-slate-400 font-bold text-sm mt-2">New complaints will appear here.</p>
                            </td>
                        </tr>
                     `;
                }
                
                snaps.forEach(d => {
                    const data = d.data(); t++;
                    if(data.status === "Pending") p++; else r++;
                    cats[data.category] = (cats[data.category] || 0) + 1;
                    
                    if (activeCategory !== 'all' && data.category !== activeCategory) return;

                    const isRes = data.status === "Resolved";
                    const pLevel = data.priority || "Normal";

                    tbody.innerHTML += `
                        <tr class="${pLevel === 'High' && !isRes ? 'bg-red-50 border-l-8 border-red-500' : 'bg-white'}">
                            <td class="p-6">
                                <div class="font-black text-slate-800 text-sm">${data.studentName}</div>
                                <select onchange="window.updPri('${d.id}', this.value)" class="mt-2 text-[9px] font-black uppercase rounded-lg p-2 border ${pLevel === 'High' ? 'bg-red-600 text-white' : 'bg-slate-100'}">
                                    <option value="Normal" ${pLevel==='Normal'?'selected':''}>Normal Priority</option>
                                    <option value="High" ${pLevel==='High'?'selected':''}>Urgent Issue</option>
                                </select>
                            </td>
                            <td class="p-6 text-sm">
                                <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-[9px] font-black uppercase">${data.category}</span>
                                <p class="mt-2 text-slate-600 font-bold italic">"${data.description}"</p>
                            </td>
                            <td class="p-6">
                                ${!isRes ? `<button onclick="window.resNote('${d.id}')" class="bg-indigo-600 text-white px-5 py-2 rounded-xl text-[10px] font-black hover:bg-black transition">RESOLVE</button>` : `<div class="text-green-600 font-black text-xs">RESOLVED ✓<br><span class="text-slate-400 font-medium text-[10px]">Note: ${data.adminNote || 'Done'}</span></div>`}
                                <button onclick="window.delDoc('${d.id}')" class="text-red-300 hover:text-red-600 text-[9px] font-black uppercase ml-4 mt-2 block">Delete</button>
                            </td>
                        </tr>`;
                });
                document.getElementById('stat-total').innerText = t;
                document.getElementById('stat-pending').innerText = p;
                document.getElementById('stat-resolved').innerText = r;
                updateCatUI(cats);
            });
        }

        function updateCatUI(cats) {
            const container = document.getElementById('cat-summary'); 
            container.innerHTML = `
                <button onclick="window.filterCat('all')" class="p-3 rounded-2xl flex justify-center items-center border-2 font-black text-[9px] uppercase transition-all ${activeCategory === 'all' ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' : 'bg-white border-slate-100 text-slate-400'}">ALL</button>
            `;
            for (let [name, count] of Object.entries(cats)) {
                const isActive = activeCategory === name;
                container.innerHTML += `
                    <button onclick="window.filterCat('${name}')" class="p-3 rounded-2xl flex justify-between items-center border-2 transition-all ${isActive ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg scale-105' : 'bg-white border-slate-100 text-slate-500 hover:border-indigo-300'}">
                        <span class="text-[9px] font-black uppercase mr-2">${name}</span>
                        <span class="text-xs font-black ${isActive ? 'text-white' : 'text-indigo-600'}">${count}</span>
                    </button>`;
            }
        }

        window.filterCat = (c) => { 
            activeCategory = c; 
            document.getElementById('filter-status').innerText = `Showing: ${c.toUpperCase()} Complaints`;
            loadData(); 
        };
        window.updPri = async (id, l) => await updateDoc(doc(db, "complaints", id), { priority: l });
        window.resNote = async (id) => {
            const n = prompt("Closing Remark for student:");
            if (n !== null) await updateDoc(doc(db, "complaints", id), { status: "Resolved", adminNote: n || "Solved", resolvedAt: serverTimestamp() });
        };
        window.delDoc = async (id) => { if(confirm("Remove permanently?")) await deleteDoc(doc(db, "complaints", id)); };
    </script>
</body>
</html>
